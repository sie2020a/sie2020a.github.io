<h1>英検・国家試験 PDF スクレイパー</h1>

<p>
VS Code + Python で作成したスクレイピングツールです。<br>
robots.txt を尊重し、学習用途のみで使用します。
</p>

<h2>主な機能</h2>
<ul>
  <li>英検・薬剤師国家試験の過去問PDF収集</li>
  <li>robots.txt チェック</li>
  <li>PDFテキスト抽出</li>
  <li>レート制限・再試行対応</li>
</ul>

<h2>技術</h2>
<ul>
  <li>Python</li>
  <li>requests / urllib</li>
  <li>pdfminer</li>
</ul>
