<!-- app1/reset.html -->
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>パスワード再設定</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">予定調整くん</div>
    <div class="topbar-right">
      <a class="btn" href="./index.html">戻る</a>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <h2>パスワード再設定</h2>
      <p class="muted">新しいパスワードを2回入力してください。</p>

      <div class="grid2">
        <div>
          <label class="label" for="newPw">新しいパスワード</label>
          <div class="pwWrap">
            <input id="newPw" class="input" type="password" autocomplete="new-password" />
            <button id="btnNewPwToggle" class="pwToggle" type="button">👁️</button>
          </div>
        </div>

        <div>
          <label class="label" for="newPw2">新しいパスワード（確認）</label>
          <div class="pwWrap">
            <input id="newPw2" class="input" type="password" autocomplete="new-password" />
            <button id="btnNewPw2Toggle" class="pwToggle" type="button">👁️</button>
          </div>
        </div>
      </div>

      <div class="row gap mt16">
        <button id="btnApply" class="btn primary" type="button">変更する</button>
        <a class="btn" href="./index.html">ログインへ</a>
      </div>

      <p id="resetMsg" class="error"></p>
    </section>
  </main>

  <!-- Firebase init（あなたの既存ファイル） -->
  <script src="./firebase_init.js"></script>

  <!-- Reset page -->
  <script type="module" src="./reset.js"></script>
</body>
</html>
