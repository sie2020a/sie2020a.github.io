<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>パスワード再設定</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">予定調整くん</div>
    <div class="topbar-right">
      <a class="btn" href="./index.html">戻る</a>
    </div>
  </header>

  <main class="wrap">
    <section class="card" style="max-width:780px;margin:24px auto;">
      <h2>パスワード再設定</h2>
      <p class="muted">新しいパスワードを2回入力してください。</p>

      <div class="grid2">
        <div>
          <label class="label">新しいパスワード</label>
          <div class="pwWrap">
            <input class="input" id="newPw" type="password" autocomplete="new-password" />
            <button class="pwEye" id="btnNewEye" type="button" aria-label="表示切替">👁️</button>
          </div>
        </div>

        <div>
          <label class="label">新しいパスワード（確認）</label>
          <div class="pwWrap">
            <input class="input" id="newPw2" type="password" autocomplete="new-password" />
            <button class="pwEye" id="btnNewEye2" type="button" aria-label="表示切替">👁️</button>
          </div>
        </div>
      </div>

      <div class="row mt16 gap">
        <button class="btn primary" id="btnDoReset" type="button">変更する</button>
        <a class="btn" href="./index.html">ログインへ</a>
      </div>

      <div class="error" id="resetError"></div>
    </section>
  </main>

  <script type="module" src="./firebase_init.js"></script>
  <script type="module" src="./reset.js"></script>
</body>
</html>
