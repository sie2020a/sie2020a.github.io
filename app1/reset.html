<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>パスワード再設定</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">予定調整くん</div>
    <div class="topbar-right">
      <a class="btn" href="./index.html">戻る</a>
    </div>
  </header>

  <main class="wrap">
    <section class="card" id="resetCard">
      <h2>パスワード再設定</h2>
      <p class="muted">新しいパスワードを2回入力してください。</p>

      <div class="grid2">
        <div>
          <label class="label" for="newPassword">新しいパスワード</label>
          <input id="newPassword" class="input" type="password" autocomplete="new-password" />
        </div>
        <div>
          <label class="label" for="newPassword2">新しいパスワード（確認）</label>
          <input id="newPassword2" class="input" type="password" autocomplete="new-password" />
        </div>
      </div>

      <div class="row mt16 gap">
        <button class="btn primary" id="btnDoReset">変更する</button>
        <a class="btn" href="./index.html">ログインへ</a>
      </div>

      <p class="error" id="resetError"></p>
      <p class="muted" id="resetInfo"></p>
    </section>
  </main>

  <!-- 重要：firebase_init.js は index.html と同じものを読み込む -->
  <script type="module" src="./firebase_init.js"></script>
  <script type="module" src="./reset.js"></script>
</body>
</html>
