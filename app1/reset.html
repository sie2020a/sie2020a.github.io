<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>パスワード再設定</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">予定調整くん</div>
    <div class="topbar-right">
      <button class="btn" type="button" onclick="location.href='./index.html'">戻る</button>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <h2>パスワード再設定</h2>
      <p class="muted">新しいパスワードを2回入力してください。</p>

      <div class="grid2">
        <div>
          <label class="label" for="newPw">新しいパスワード</label>
          <div class="pwWrap">
            <input id="newPw" class="input" type="password" autocomplete="new-password" />
            <button id="btnEye1" class="pwEye" type="button" aria-label="表示切替">👁️</button>
          </div>
        </div>

        <div>
          <label class="label" for="newPw2">新しいパスワード（確認）</label>
          <div class="pwWrap">
            <input id="newPw2" class="input" type="password" autocomplete="new-password" />
            <button id="btnEye2" class="pwEye" type="button" aria-label="表示切替">👁️</button>
          </div>
        </div>
      </div>

      <div class="row gap mt16">
        <button id="btnDoReset" class="btn primary">変更する</button>
        <button id="btnGoLogin" class="btn">ログインへ</button>
      </div>

      <p id="resetMsg" class="error"></p>
    </section>
  </main>

  <script type="module" src="./firebase_init.js"></script>
  <script type="module" src="./reset.js"></script>
</body>
</html>
