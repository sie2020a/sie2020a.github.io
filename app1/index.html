<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>予定調整くん</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">予定調整くん</div>
    <div class="topbar-right">
      <span class="pill" id="userPill">未ログイン</span>
      <button class="btn" id="btnFullscreen" type="button" title="カレンダー全画面">⛶</button>
      <button class="btn" id="btnLogout" type="button" disabled>ログアウト</button>
    </div>
  </header>

  <main class="wrap">

    <!-- ログイン -->
    <section class="card" id="loginCard">
      <h2>ログイン</h2>
      <p class="muted">メールアドレスとパスワードでログインしてください。</p>

      <div class="grid2">
        <div>
          <label class="label">メールアドレス</label>
          <input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com" />
        </div>

        <div>
          <label class="label">パスワード</label>
          <div class="pwWrap">
            <input class="input" id="password" type="password" autocomplete="current-password" placeholder="••••••••" />
            <button class="pwEye" id="btnPwEye" type="button" aria-label="パスワード表示切替">👁️</button>
          </div>
        </div>
      </div>

      <div class="row mt16 gap">
        <button class="btn primary" id="btnLogin" type="button">ログイン</button>
        <button class="btn" id="btnSignup" type="button">新アカウントを作る</button>
        <button class="btn" id="btnReset" type="button">パスワード忘れた</button>
      </div>

      <div class="error" id="authError"></div>
    </section>

    <!-- 予定作成 -->
    <section class="card" id="createCard" hidden>
      <h3>予定を追加</h3>
      <p class="muted">月表示にはタイトルだけ出ます（メモは月表示に出しません）。</p>

      <label class="label">予定名（必須）</label>
      <input class="input" id="title" type="text" placeholder="例：病院 / 打ち合わせ / 子ども迎え" />

      <label class="label mt12">メモ（任意）</label>
      <input class="input" id="memo" type="text" placeholder="例：持ち物、詳細など（個人情報は控えめ推奨）" />

      <div class="grid2 mt12">
        <div>
          <label class="label">日付（必須）</label>
          <input class="input" id="date" type="date" />
        </div>
        <div>
          <label class="label">時間（任意）</label>
          <input class="input" id="time" type="time" />
        </div>
      </div>

      <div class="row mt16 gap">
        <button class="btn primary" id="btnAdd" type="button">追加</button>
        <button class="btn" id="btnClearInput" type="button">入力クリア</button>
        <button class="btn danger" id="btnDeleteAll" type="button">全削除</button>
        <button class="btn" id="btnExport" type="button">Export(JSON)</button>
      </div>

      <div class="error" id="dataError"></div>
    </section>

    <!-- カレンダー -->
    <section class="card" id="calendarCard" hidden>
      <div class="calHead">
        <div class="calNav">
          <button class="btn" id="btnPrevMonth" type="button">←</button>
          <div class="calTitle" id="calTitle"></div>
          <button class="btn" id="btnNextMonth" type="button">→</button>
        </div>

        <div class="calNav">
          <button class="btn" id="btnToday" type="button">今日</button>
        </div>
      </div>

      <div class="calLayout">
        <div class="calendar" id="calendar"></div>

        <aside class="dayPanel">
          <div class="dayPanelHead">
            <div class="dayTitle" id="dayTitle">日付を選択</div>
            <button class="btn" id="btnCloseDayPanel" type="button">閉じる</button>
          </div>

          <div class="dayList" id="dayList">
            <p class="muted">カレンダーの日付をクリックすると、その日の予定とメモが見れます。</p>
          </div>
        </aside>
      </div>
    </section>

  </main>

  <!-- ✅ 重要：両方とも type="module" -->
  <script type="module" src="./firebase_init.js"></script>
  <script type="module" src="./script.js"></script>
</body>
</html>
