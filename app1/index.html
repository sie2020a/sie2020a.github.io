<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
  <title>予定調整くん</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">予定調整くん</div>

    <div class="topbar-right">
      <div class="pill" id="userPill" aria-live="polite">未ログイン</div>
      <button class="btn ghost" id="btnFullscreen" title="カレンダーを全画面">⛶</button>
      <button class="btn ghost" id="btnLogout" disabled>ログアウト</button>
    </div>
  </header>

  <main class="wrap">

    <section class="card" id="loginCard">
      <h2>ログイン</h2>
      <p class="muted">メールアドレスとパスワードでログインしてください。</p>

      <div class="grid2">
        <div>
          <label class="label">メールアドレス</label>
          <input id="email" class="input" type="email" placeholder="example@gmail.com" autocomplete="email" />
        </div>
        <div>
          <label class="label">パスワード</label>
          <input id="password" class="input" type="password" placeholder="パスワード" autocomplete="current-password" />
        </div>
      </div>

      <div class="row gap mt12">
        <button class="btn primary" id="btnLogin">ログイン</button>
        <button class="btn" id="btnSignup">新アカウントを作る</button>
        <button class="btn ghost" id="btnReset">パスワードを変えたい、または忘れた人はクリック</button>
      </div>

      <p class="error" id="authError" aria-live="polite"></p>
    </section>

    <section class="card" id="createCard" hidden>
      <h2>予定を作る</h2>

      <div class="grid2">
        <div>
          <label class="label">予定名</label>
          <input id="title" class="input" placeholder="例：学校 / 仕事 / 通院" />
        </div>

        <div>
          <label class="label">メモ（任意）</label>
          <input id="memo" class="input" placeholder="例：場所・持ち物など" />
        </div>

        <div>
          <label class="label">日付（必須）</label>
          <input id="date" type="date" class="input" />
        </div>

        <div>
          <label class="label">時間（任意）</label>
          <input id="time" type="time" class="input" />
        </div>
      </div>

      <div class="row gap mt12">
        <button class="btn primary" id="btnAdd">追加</button>
        <button class="btn" id="btnClearInput">入力クリア</button>
      </div>
    </section>

    <section class="card" id="calendarCard" hidden>
      <div class="calHead">
        <h2>カレンダー</h2>

        <div class="calNav">
          <button class="btn" id="btnPrevMonth">◀</button>
          <div class="calTitle" id="calTitle">----</div>
          <button class="btn" id="btnNextMonth">▶</button>
          <button class="btn ghost" id="btnToday">今日</button>
        </div>
      </div>

      <div class="calLayout" id="calLayout">
        <div class="calendar" id="calendar" aria-label="月カレンダー"></div>

        <aside class="dayPanel" id="dayPanel" aria-label="選択日の詳細">
          <div class="dayPanelHead">
            <div class="dayTitle" id="dayTitle">日付を選択</div>
            <button class="btn ghost" id="btnCloseDayPanel" title="閉じる">✕</button>
          </div>

          <div class="dayList" id="dayList">
            <p class="muted">カレンダーの日付をクリックすると、その日の予定とメモが見れます。</p>
          </div>
        </aside>
      </div>

      <div class="row end gap mt16">
        <button class="btn" id="btnExport">JSONエクスポート</button>
        <button class="btn danger" id="btnDeleteAll">全削除</button>
      </div>

      <p class="error mt12" id="dataError" aria-live="polite"></p>
    </section>
  </main>

  <dialog id="editDialog" class="dialog">
    <form method="dialog" class="dialogBody" id="editForm">
      <h3>予定を編集</h3>

      <div class="grid2">
        <div>
          <label class="label">予定名</label>
          <input id="editTitle" class="input" />
        </div>
        <div>
          <label class="label">メモ</label>
          <input id="editMemo" class="input" />
        </div>
        <div>
          <label class="label">日付</label>
          <input id="editDate" type="date" class="input" />
        </div>
        <div>
          <label class="label">時間</label>
          <input id="editTime" type="time" class="input" />
        </div>
      </div>

      <div class="row end gap mt16">
        <button class="btn" value="cancel">キャンセル</button>
        <button class="btn primary" id="btnSaveEdit" value="ok">保存</button>
      </div>
    </form>
  </dialog>

  <!-- Firebase（Auth+Firestore） -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD6uY03dlo9wPQBRHolvJ2C7orjRdjtqYo",
      authDomain: "schedule-app-410f9.firebaseapp.com",
      projectId: "schedule-app-410f9",
      storageBucket: "schedule-app-410f9.firebasestorage.app",
      messagingSenderId: "645147677497",
      appId: "1:645147677497:web:2a19c74c40fac828764ee8",
      measurementId: "G-BBJ8VE29TH"
    };

    window.firebaseApp = initializeApp(firebaseConfig);
    window.firebaseAuth = getAuth(window.firebaseApp);
    window.firebaseDb = getFirestore(window.firebaseApp);
  </script>

  <script type="module" src="./script.js"></script>
</body>
</html>
