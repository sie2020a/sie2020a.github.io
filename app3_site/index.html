<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Diary Login</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans JP",sans-serif;padding:24px;max-width:520px;margin:0 auto;}
    h1{margin:0 0 14px;}
    .row{display:flex;gap:10px;margin:10px 0;}
    input{flex:1;padding:10px;font-size:16px;}
    button{padding:10px 12px;font-size:14px;cursor:pointer;}
    .hint{color:#555;font-size:13px;margin-top:6px;}
    .msg{margin-top:12px;white-space:pre-wrap;}
  </style>
</head>
<body>
  <h1>Diary</h1>

  <div class="row">
    <input id="email" type="email" placeholder="メールアドレス" autocomplete="email">
  </div>
  <div class="row">
    <input id="pass" type="password" placeholder="パスワード" autocomplete="current-password">
  </div>

  <div class="row">
    <button id="loginBtn">ログイン</button>
    <button id="signupBtn">新規登録</button>
  </div>
  <div class="row">
    <button id="resetBtn">パスワードを忘れた</button>
  </div>

  <div class="hint">
    ログイン成功したら <code>/app3/</code> に移動します。
  </div>

  <div id="msg" class="msg"></div>

  <script type="module">
    // Firebase v9+ modular (CDN)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

    // ▼ここをあなたの Firebase config に置き換え（GitHubに晒すなら後で環境変数化推奨）
    const firebaseConfig = {
      apiKey: "ここ",
      authDomain: "diary-32180.firebaseapp.com",
      projectId: "diary-32180",
      storageBucket: "diary-32180.appspot.com",
      messagingSenderId: "ここ",
      appId: "ここ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const $email = document.getElementById("email");
    const $pass = document.getElementById("pass");
    const $msg  = document.getElementById("msg");

    function say(t){ $msg.textContent = t; }

    document.getElementById("loginBtn").onclick = async () => {
      say("ログイン中...");
      try {
        await signInWithEmailAndPassword(auth, $email.value.trim(), $pass.value);
        location.href = "/app3/"; // 成功したら app3 へ
      } catch (e) {
        say("ログイン失敗: " + e.code + "\n" + e.message);
      }
    };

    document.getElementById("signupBtn").onclick = async () => {
      say("新規登録中...");
      try {
        await createUserWithEmailAndPassword(auth, $email.value.trim(), $pass.value);
        location.href = "/app3/";
      } catch (e) {
        say("新規登録失敗: " + e.code + "\n" + e.message);
      }
    };

    document.getElementById("resetBtn").onclick = async () => {
      const email = $email.value.trim();
      if (!email) return say("先にメールアドレスを入力して。");
      say("リセットメール送信中...");
      try {
        await sendPasswordResetEmail(auth, email);
        say("送った。メール見て。迷惑メールも。");
      } catch (e) {
        say("送信失敗: " + e.code + "\n" + e.message);
      }
    };
  </script>
</body>
</html>
